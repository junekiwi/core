import_history:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: withings
    start_date:
      required: true
      example: "2024-01-01"
      selector:
        date:
    end_date:
      example: "2024-12-31"
      selector:
        date:
    data_types:
      default:
        - measurements
        - sleep
        - activity
      selector:
        select:
          multiple: true
          options:
            - measurements
            - sleep
            - activity
          translation_key: data_types
